spring.application.name=runpace
spring.profiles.active=dev
app.fluxo-plano.modo=${APP_FLUXO_PLANO_MODO:DESENVOLVIMENTO}
endurax.ai.agent.max-correction-attempts=${ENDURAX_AI_AGENT_MAX_CORRECTION_ATTEMPTS:2}
openai.api-key=${OPENAI_API_KEY:}
openai.model=${OPENAI_MODEL:gpt-4o-mini}
openai.base-url=${OPENAI_BASE_URL:https://api.openai.com}
openai.max-output-tokens=${OPENAI_MAX_OUTPUT_TOKENS:7000}
openai.connect-timeout-ms=${OPENAI_CONNECT_TIMEOUT_MS:10000}
openai.read-timeout-ms=${OPENAI_READ_TIMEOUT_MS:120000}

mercado-pago.access-token=${MERCADO_PAGO_ACCESS_TOKEN:}
mercado-pago.valor-plano=12.90
mercado-pago.expiracao-pix-minutos=30
mercado-pago.ambiente-teste=${MERCADO_PAGO_AMBIENTE_TESTE:true}
