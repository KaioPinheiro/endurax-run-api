spring.application.name=runpace
spring.profiles.default=dev
# Por padrao, o IP usa request.remoteAddr e ignora X-Forwarded-For.
# Em producao, use NATIVE somente se o proxy confiavel remover headers recebidos do cliente,
# preencher os forwarded headers e restringir o RemoteIpValve aos IPs desse proxy.
server.forward-headers-strategy=${SERVER_FORWARD_HEADERS_STRATEGY:NONE}
server.tomcat.remoteip.remote-ip-header=x-real-ip
server.tomcat.remoteip.protocol-header=x-forwarded-proto
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level requestId=%X{requestId:-} [%thread] %logger{36} - %msg%n
app.fluxo-plano.modo=${APP_FLUXO_PLANO_MODO:DESENVOLVIMENTO}
endurax.ai.agent.max-correction-attempts=${ENDURAX_AI_AGENT_MAX_CORRECTION_ATTEMPTS:2}
openai.api-key=${OPENAI_API_KEY:}
openai.model=${OPENAI_MODEL:gpt-4o-mini}
openai.base-url=${OPENAI_BASE_URL:https://api.openai.com}
openai.max-output-tokens=${OPENAI_MAX_OUTPUT_TOKENS:7000}
openai.connect-timeout-ms=${OPENAI_CONNECT_TIMEOUT_MS:10000}
openai.read-timeout-ms=${OPENAI_READ_TIMEOUT_MS:120000}

mercado-pago.access-token=${MERCADO_PAGO_ACCESS_TOKEN:}
mercado-pago.webhook-secret=${MERCADO_PAGO_WEBHOOK_SECRET:}
mercado-pago.valor-plano=12.90
mercado-pago.expiracao-pix-minutos=15
mercado-pago.ambiente-teste=${MERCADO_PAGO_AMBIENTE_TESTE:true}

# Rate limit por IP efetivo da conexao (por instancia da aplicacao).
app.rate-limit.enabled=${APP_RATE_LIMIT_ENABLED:true}
app.rate-limit.max-entries=${APP_RATE_LIMIT_MAX_ENTRIES:10000}
app.rate-limit.solicitacao.requests=${APP_RATE_LIMIT_SOLICITACAO_REQUESTS:10}
app.rate-limit.solicitacao.window-seconds=${APP_RATE_LIMIT_SOLICITACAO_WINDOW_SECONDS:3600}
app.rate-limit.pix.requests=${APP_RATE_LIMIT_PIX_REQUESTS:5}
app.rate-limit.pix.window-seconds=${APP_RATE_LIMIT_PIX_WINDOW_SECONDS:900}
app.rate-limit.geracao.requests=${APP_RATE_LIMIT_GERACAO_REQUESTS:3}
app.rate-limit.geracao.window-seconds=${APP_RATE_LIMIT_GERACAO_WINDOW_SECONDS:3600}
app.rate-limit.consulta.requests=${APP_RATE_LIMIT_CONSULTA_REQUESTS:120}
app.rate-limit.consulta.window-seconds=${APP_RATE_LIMIT_CONSULTA_WINDOW_SECONDS:60}
